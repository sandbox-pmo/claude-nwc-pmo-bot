<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>PMO Bot</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PMO Bot">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08211C">
<style>
:root{
  --wa-bg:#0B141A; --wa-header:#202C33; --wa-panel:#111B21;
  --bubble-in:#202C33; --bubble-out:#0F5C46; --text:#E9EDEF; --muted:#8696A0;
  --accent:#00A884; --card-bg:#0F1A20; --line:#2A3942;
  --green:#00C288; --amber:#FFC24B; --red:#FF6B6B;
  --saudi-green:#0B6E4F; --gold:#C9A96A; --water-blue:#1E5F8C;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --wa-bg:#E5DDD5; --wa-header:#008069; --wa-panel:#F0F2F5;
  --bubble-in:#FFFFFF; --bubble-out:#D9FDD3; --text:#111B21; --muted:#667781;
  --accent:#008069; --card-bg:#FFFFFF; --line:#E9EDEF;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0; background:var(--wa-panel); font-family:Calibri,Arial,sans-serif; min-height:100%; color:var(--text);}
.phone{max-width:460px; margin:0 auto; height:100vh; height:100dvh; display:flex; flex-direction:column; background:var(--wa-bg); box-shadow:0 0 40px rgba(0,0,0,.3);}

.header{background:linear-gradient(120deg, var(--saudi-green) 0%, var(--water-blue) 100%); color:#fff; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top,0px)); display:flex; align-items:center; gap:12px; flex-shrink:0; position:relative;}
.avatar{width:40px; height:40px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.25); border:2px solid rgba(255,255,255,.85);}
.avatar img{width:100%; height:100%; object-fit:cover; display:block;}
.header .headtext{flex:1; min-width:0;}
.header .name{font-weight:bold; font-size:15px; line-height:1.25;}
.header .status{font-size:11px; opacity:.9;}
.brand{display:flex; align-items:center; gap:6px; flex-shrink:0;}
.brand svg{width:22px; height:22px; flex-shrink:0;}
.brand .brandtext{font-size:9.5px; line-height:1.25; text-align:right; opacity:.95;}
.brand .brandtext .ar{direction:rtl; font-weight:bold; font-size:10.5px;}
.brand .brandtext .en{opacity:.85;}
.geopattern{height:6px; flex-shrink:0; background-color:var(--wa-bg);
  background-image: repeating-linear-gradient(45deg, var(--gold) 0, var(--gold) 3px, transparent 3px, transparent 9px),
                     repeating-linear-gradient(-45deg, var(--gold) 0, var(--gold) 3px, transparent 3px, transparent 9px);
  background-position: 0 0, 0 0; opacity:.55;
}

.typing{display:flex; gap:4px; align-items:center; padding:10px 12px; background:var(--bubble-in); border-radius:10px; border-top-left-radius:2px; align-self:flex-start; width:fit-content;}
.typing span{width:6px; height:6px; border-radius:50%; background:var(--muted); display:inline-block; animation:tbounce 1.2s infinite ease-in-out;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes tbounce{
  0%, 60%, 100%{ transform:translateY(0); opacity:.5; }
  30%{ transform:translateY(-4px); opacity:1; }
}

.thread{flex:1; overflow-y:auto; padding:14px 10px; display:flex; flex-direction:column; gap:8px;
  background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,.02) 0, transparent 40%);
}
.msg{max-width:86%; padding:8px 10px; border-radius:10px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word;}
.msgrow{display:flex; align-items:flex-end; gap:7px; align-self:flex-start; max-width:90%;}
.msgavatar{width:26px; height:26px; border-radius:50%; flex-shrink:0; object-fit:cover; box-shadow:0 1px 3px rgba(0,0,0,.35); border:1.5px solid rgba(255,255,255,.7);}
.msgrow .msg{margin:0; max-width:100%;}
.msgrow .card{margin:0;}
.msg.in{background:var(--bubble-in); align-self:flex-start; border-top-left-radius:2px;}
.msg.out{background:var(--bubble-out); align-self:flex-end; border-top-right-radius:2px; color:var(--text);}
.msg .time{display:block; text-align:right; font-size:10px; color:var(--muted); margin-top:4px;}

.card{background:var(--card-bg); border:1px solid var(--line); border-radius:12px; border-top-left-radius:2px; padding:12px; width:92%; max-width:340px; align-self:flex-start; font-size:13px; overflow-wrap:break-word; word-break:break-word;}
.card.rag-tint-Green{background:linear-gradient(180deg, rgba(0,194,136,.14), var(--card-bg) 70px); border-color:rgba(0,194,136,.35);}
.card.rag-tint-Amber{background:linear-gradient(180deg, rgba(255,194,75,.16), var(--card-bg) 70px); border-color:rgba(255,194,75,.4);}
.card.rag-tint-Red{background:linear-gradient(180deg, rgba(255,107,107,.18), var(--card-bg) 70px); border-color:rgba(255,107,107,.45);}
.card .rag-strip{height:5px; border-radius:3px; margin-bottom:10px;}
.card .rag-Green{background:var(--green);} .card .rag-Amber{background:var(--amber);} .card .rag-Red{background:var(--red);}
.card .name-ar{direction:rtl; text-align:right; font-weight:bold; font-size:14.5px; line-height:1.4; margin-bottom:6px; overflow-wrap:break-word; word-break:break-word;}
.card .meta{color:var(--muted); font-size:11.5px; margin-bottom:10px;}
.card .row{display:flex; justify-content:space-between; padding:4px 0; border-top:1px solid var(--line); font-size:12.5px;}
.card .row:first-of-type{border-top:none;}
.card .row .l{color:var(--muted);}
.card .row .v{font-weight:bold; text-align:right; overflow-wrap:break-word; word-break:break-word; max-width:65%;}
.card .comp{display:flex; gap:6px; margin:8px 0;}
.card .comp .pill{flex:1; text-align:center; padding:5px 2px; border-radius:7px; font-size:11px;}
.card .comp .pill .n{font-weight:bold; font-size:14px; display:block;}
.pill-good{background:rgba(0,194,136,.15); color:var(--green);}
.pill-bad{background:rgba(255,107,107,.15); color:var(--red);}
.card .health{display:flex; align-items:center; gap:10px; margin:8px 0; padding:8px; border-radius:8px; background:rgba(255,255,255,.03);}
.card .health .num{font-size:26px; font-weight:bold;}
.card .attn{margin-top:10px; padding:8px 10px; border-radius:8px; font-size:11.5px; line-height:1.5;}
.attn-Green{background:rgba(0,194,136,.12); color:var(--green);}
.attn-Amber{background:rgba(255,194,75,.12); color:var(--amber);}
.attn-Red{background:rgba(255,107,107,.12); color:var(--red);}
.attn-ar{direction:rtl; display:inline;}

.optlist{margin-top:6px;}
.optbtn{display:block; width:100%; text-align:right; direction:rtl; background:rgba(255,255,255,.04); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:8px; margin-top:5px; font-size:12.5px; cursor:pointer;}
.optbtn:hover{background:rgba(255,255,255,.09);}
.optbtn .n{direction:ltr; display:inline-block; color:var(--accent); font-weight:bold; margin-left:6px;}

.inputbar{display:flex; gap:8px; padding:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); background:var(--wa-header); flex-shrink:0;}
.inputbar input{flex:1; border:none; border-radius:20px; padding:10px 14px; font-size:14px; background:var(--card-bg); color:var(--text);}
.inputbar button{background:var(--accent); border:none; color:#fff; width:40px; height:40px; border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0;}
.quickrow{display:flex; gap:6px; padding:0 10px 8px; overflow-x:auto; flex-shrink:0;}
.quickchip{background:var(--wa-header); color:#fff; border:1px solid rgba(255,255,255,.15); padding:6px 12px; border-radius:16px; font-size:11.5px; white-space:nowrap; cursor:pointer;}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="avatar" aria-hidden="true">
      <img id="headerAvatarImg" src="" alt="" />
    </div>
    <div class="headtext">
      <div class="name">PMO Bot</div>
      <div class="status">online &middot; Northwestern Cluster</div>
    </div>
    <div class="brand" aria-hidden="true">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2 C12 2 5 10.5 5 15.5 C5 19.6 8.1 22 12 22 C15.9 22 19 19.6 19 15.5 C19 10.5 12 2 12 2 Z" fill="#7FD6E8"/>
        <path d="M12 6.5 C10.5 9 8.5 12.2 8.5 15 C8.5 17.2 10 18.8 12 18.8" stroke="#FFFFFF" stroke-width="1" fill="none" opacity="0.6" stroke-linecap="round"/>
      </svg>
      <div class="brandtext">
        <div class="ar">شركة المياه الوطنية</div>
        <div class="en">National Water Company</div>
      </div>
    </div>
  </div>
  <div class="geopattern" aria-hidden="true"></div>
  <div class="thread" id="thread" role="log" aria-live="polite"></div>
  <div class="quickrow">
    <div class="quickchip" data-q="help" role="button" tabindex="0">help</div>
    <div class="quickchip" data-q="red" role="button" tabindex="0">red projects</div>
    <div class="quickchip" data-q="amber" role="button" tabindex="0">amber projects</div>
    <div class="quickchip" data-q="Tabuk" role="button" tabindex="0">Tabuk</div>
    <div class="quickchip" data-q="Madinah" role="button" tabindex="0">Madinah</div>
  </div>
  <div class="inputbar">
    <input type="text" id="inp" placeholder="Type project number, name, or city..." aria-label="Ask the PMO Bot">
    <button id="sendBtn" aria-label="Send">&#10148;</button>
  </div>
</div>

function timeNow(){
  const d = new Date();
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function scrollBottom(){
  const t = document.getElementById('thread');
  t.scrollTop = t.scrollHeight;
}

function addText(text, who){
  const t = document.getElementById('thread');
  const bubble = document.createElement('div');
  bubble.className = 'msg ' + who;
  bubble.innerHTML = text.replace(/\n/g,'<br>') + `<span class="time">${timeNow()}</span>`;
  if(who === 'in'){
    const row = document.createElement('div');
    row.className = 'msgrow';
    row.innerHTML = `<img class="msgavatar" src="${BOT_AVATAR}" alt="">`;
    row.appendChild(bubble);
    t.appendChild(row);
  } else {
    t.appendChild(bubble);
  }
  scrollBottom();
}

function showTyping(){
  const t = document.getElementById('thread');
  const row = document.createElement('div');
  row.className = 'msgrow';
  row.id = 'typingIndicator';
  row.innerHTML = `<img class="msgavatar" src="${BOT_AVATAR}" alt=""><div class="typing" aria-label="PMO Bot is typing"><span></span><span></span><span></span></div>`;
  t.appendChild(row);
  scrollBottom();
}

function hideTyping(){
  const el = document.getElementById('typingIndicator');
  if(el) el.remove();
}

function addOptions(matches, query){
  const t = document.getElementById('thread');
  const row = document.createElement('div');
  row.className = 'msgrow';
  const bubble = document.createElement('div');
  bubble.className = 'msg in';
  let html = `I found ${matches.length} projects matching "${query}". Which one?<div class="optlist">`;
  matches.slice(0,8).forEach((p,i)=>{
    html += `<button class="optbtn" data-num="${p.num}">${p.name} <span class="n">${p.num}</span></button>`;
  });
  html += `</div><span class="time">${timeNow()}</span>`;
  bubble.innerHTML = html;
  row.innerHTML = `<img class="msgavatar" src="${BOT_AVATAR}" alt="">`;
  row.appendChild(bubble);
  t.appendChild(row);
  bubble.querySelectorAll('.optbtn').forEach(b=>{
    b.addEventListener('click', ()=>{ handleQuery(b.dataset.num, true); });
  });
  scrollBottom();
}

function ragEmoji(rag){ return rag==='Green' ? '🟢' : rag==='Amber' ? '🟠' : '🔴'; }
function pillClass(v){ return v>=90 ? 'pill-good' : 'pill-bad'; }

function addCard(p){
  const t = document.getElementById('thread');
  const row = document.createElement('div');
  row.className = 'msgrow';
  const div = document.createElement('div');
  div.className = `card rag-tint-${p.rag}`;
  const primaryLabel = p.type==='Works' ? 'Contractor' : 'Consultant';
  const primaryIcon = p.type==='Works' ? '👷' : '🧑‍💼';
  const showSecondary = p.consultantName && p.consultantName !== p.contractorName;
  const secondaryLabel = p.type==='Works' ? 'Consultant' : 'Supervising Consultant';
  const svLabel = p.sv>0 ? `+${p.sv} pts (behind plan)` : p.sv<0 ? `${p.sv} pts (ahead of plan)` : `0 (on plan)`;
  div.innerHTML = `
    <div class="rag-strip rag-${p.rag}"></div>
    <div class="meta">${ragEmoji(p.rag)} ${p.projectStatus} &nbsp;·&nbsp; No. ${p.num} &nbsp;·&nbsp; ${p.type}</div>
    <div class="name-ar">${p.name}</div>
    <div class="meta">📍 ${p.region} — <span style="direction:rtl;display:inline">${p.city}</span></div>

    <div class="health">
      <div class="num" style="color:${p.rag==='Green'?'var(--green)':p.rag==='Amber'?'var(--amber)':'var(--red)'}">${p.health}</div>
      <div>Health Score /100<br><span style="color:var(--muted);font-size:11px;">${p.contractStatus}</span></div>
    </div>
    <div class="comp">
      <div class="pill ${pillClass(p.scheduleScore)}"><span class="n">${p.scheduleScore}</span>Schedule</div>
      <div class="pill ${pillClass(p.statusScore)}"><span class="n">${p.statusScore}</span>Status</div>
      <div class="pill ${pillClass(p.overrunScore)}"><span class="n">${p.overrunScore}</span>Overrun</div>
    </div>

    <div class="row"><span class="l">${primaryIcon} ${primaryLabel}</span><span class="v" style="direction:rtl;">${p.contractorName||'—'}</span></div>
    ${showSecondary ? `<div class="row"><span class="l">🧭 ${secondaryLabel}</span><span class="v" style="direction:rtl;">${p.consultantName}</span></div>` : ''}
    <div class="row"><span class="l">📈 Planned Progress</span><span class="v">${p.planned}%</span></div>
    <div class="row"><span class="l">📉 Schedule Variance</span><span class="v">${svLabel}</span></div>
    <div class="row"><span class="l">💰 Contract Value</span><span class="v">SAR ${p.value.toLocaleString()} mm</span></div>
    <div class="row"><span class="l">⏳ Duration Elapsed</span><span class="v">${p.elapsed}%</span></div>

    <div class="attn attn-${p.rag}">⚠️ <b>Attention:</b> <span>${p.attention.replace(p.reason||'\u0000', `<span class="attn-ar">${p.reason||''}</span>`)}</span></div>
  `;
  row.innerHTML = `<img class="msgavatar" src="${BOT_AVATAR}" alt="">`;
  row.appendChild(div);
  t.appendChild(row);
  scrollBottom();
}

function norm(s){ return (s||'').toString().toLowerCase().trim(); }

function findMatches(qRaw){
  const q = norm(qRaw);
  if(!q) return {type:'none'};

  // exact project number
  let exact = PROJECTS.filter(p=>norm(p.num)===q);
  if(exact.length===1) return {type:'one', project:exact[0]};

  // command words
  if(['red','amber','green'].includes(q)){
    const rag = q[0].toUpperCase()+q.slice(1);
    const list = PROJECTS.filter(p=>p.rag===rag);
    return {type:'rag', rag, list};
  }
  if(q==='help'){ return {type:'help'}; }

  // region match
  const regions = [...new Set(PROJECTS.map(p=>p.region.toLowerCase()))];
  if(regions.includes(q)){
    const list = PROJECTS.filter(p=>p.region.toLowerCase()===q);
    return {type:'region', region: PROJECTS.find(p=>p.region.toLowerCase()===q).region, list};
  }

  // partial project number
  let partialNum = PROJECTS.filter(p=>norm(p.num).includes(q));
  if(partialNum.length===1) return {type:'one', project:partialNum[0]};
  if(partialNum.length>1) return {type:'many', list:partialNum};

  // name / city / contractor contains
  let byText = PROJECTS.filter(p=>
    norm(p.name).includes(q) || norm(p.city).includes(q) || norm(p.contractorName).includes(q) || norm(p.consultantName).includes(q)
  );
  if(byText.length===1) return {type:'one', project:byText[0]};
  if(byText.length>1) return {type:'many', list:byText};

  return {type:'none'};
}

function handleQuery(qRaw, isNum){
  addText(qRaw, 'out');
  showTyping();
  const delay = 500 + Math.random()*400;
  setTimeout(()=>{
    hideTyping();
    const r = findMatches(qRaw);
    if(r.type==='help'){
      addText("You can ask me for a project by:\n• *Project number* — e.g. O138\n• *Project name keyword* — e.g. Yanbu, Badr\n• *City / Region* — e.g. Tabuk, Madinah\n\nOr type *red* / *amber* / *green* to list projects in that health band.", 'in');
      return;
    }
    if(r.type==='none'){
      addText(`I couldn't find a project matching "${qRaw}". Try a project number, part of the name, or a city/region. Type *help* for options.`, 'in');
      return;
    }
    if(r.type==='one'){
      addText(`Here's the latest card for *${r.project.num}* (data as of 17 Sep 2026):`, 'in');
      addCard(r.project);
      return;
    }
    if(r.type==='many'){
      addOptions(r.list, qRaw);
      return;
    }
    if(r.type==='region'){
      const counts = {Green:0,Amber:0,Red:0};
      r.list.forEach(p=>counts[p.rag]++);
      addText(`${r.region}: ${r.list.length} projects — 🟢 ${counts.Green} · 🟠 ${counts.Amber} · 🔴 ${counts.Red}\n\nReply with a project number, or type "${r.region.toLowerCase()} red" style isn't supported yet — try a project name or number below:`, 'in');
      addOptions(r.list.filter(p=>p.rag!=='Green').concat(r.list.filter(p=>p.rag==='Green')).slice(0,8), r.region);
      return;
    }
    if(r.type==='rag'){
      if(r.list.length===0){ addText(`No ${r.rag} projects right now — good news!`, 'in'); return; }
      addText(`${r.list.length} project(s) currently ${r.rag}:`, 'in');
      addOptions(r.list, r.rag);
      return;
    }
  }, delay);
}

document.getElementById('sendBtn').addEventListener('click', ()=>{
  const inp = document.getElementById('inp');
  if(inp.value.trim()){ handleQuery(inp.value.trim()); inp.value=''; }
});
document.getElementById('inp').addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){ document.getElementById('sendBtn').click(); }
});
document.querySelectorAll('.quickchip').forEach(c=>{
  c.addEventListener('click', ()=>{ handleQuery(c.dataset.q); });
  c.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); handleQuery(c.dataset.q); }
  });
});
